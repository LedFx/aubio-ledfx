# Lint, test, build and publish aubio-ledfx.
#
# Pull requests and main: lint gate, C test suite, sdist and portable wheels
# for every platform (cibuildwheel runs the Python test suite against each
# wheel). A v* tag (pushed by release-please.yml when its release PR merges)
# also publishes: PyPI through Trusted Publishing behind the pypi
# environment, then the wheels are attached to release-please's draft GitHub
# release, which is published.
#
# The file keeps its historical name: PyPI's trusted publisher is bound to
# `build.yml`. The workflow is named "CI" because lint-notify.yml looks it up
# by that name.
name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancel main or tag runs: tag runs publish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Fast lint gate before any build spend. Same hook set as `uvx prek run
  # --all-files` locally. autofix.ci runs in parallel and pushes fixes; that
  # push re-triggers this workflow. Failure comments come from lint-notify.yml.
  lint:
    name: Lint (prek)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: j178/prek-action@4e14d07f9231acabce116ccfca13b13dd9755ece # v3.0.0
        with:
          prek-version: "0.5.3"
          extra-args: --all-files # the action adds --show-diff-on-failure itself

  # The tag must match the version release-please wrote, everywhere it wrote it.
  version:
    name: Version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          sparse-checkout: |
            pyproject.toml
            meson.build
            VERSION
            vcpkg.json
          sparse-checkout-cone-mode: false
      - id: version
        env:
          REF: ${{ github.ref }}
          EVENT: ${{ github.event_name }}
        run: |
          version=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([a-z0-9.+-]*)$ ]]; then
            echo "::error::Unexpected version string in pyproject.toml"
            exit 1
          fi
          meson=$(sed -nE "s/^  version: '([^']+)'.*/\1/p" meson.build)
          vcpkg=$(python3 -c "import json; print(json.load(open('vcpkg.json'))['version-string'])")
          # shellcheck disable=SC1091
          file=$(. ./VERSION && echo "$AUBIO_MAJOR_VERSION.$AUBIO_MINOR_VERSION.$AUBIO_PATCH_VERSION$AUBIO_VERSION_STATUS")
          for other in "$meson" "$vcpkg" "$file"; do
            if [[ "$other" != "$version" ]]; then
              echo "::error::Version mismatch: pyproject.toml $version, meson.build $meson, vcpkg.json $vcpkg, VERSION $file"
              exit 1
            fi
          done
          if [[ "$REF" == refs/tags/v* && "$REF" != "refs/tags/v$version" ]]; then
            echo "::error::Tag ${REF#refs/tags/} does not match version $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$EVENT" == push && "$REF" == refs/tags/v* ]]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi

  # The C library and its own test programs, against system libraries.
  c-tests:
    name: C tests (${{ matrix.name }})
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: release
            setup: -Dbuildtype=release
          - name: double precision
            setup: -Dbuildtype=release -Ddouble=true
          # FFTW is off by default (ooura measured as fast at aubio's usual
          # power-of-two sizes); keep the opt-in backend building and passing
          - name: fftw3f
            setup: -Dbuildtype=release -Dfftw3f=enabled
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install system libraries
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends \
            libsndfile1-dev libsamplerate0-dev libfftw3-dev \
            libavcodec-dev libavformat-dev libswresample-dev libavutil-dev
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: false
      - name: Build and test
        env:
          SETUP: ${{ matrix.setup }}
        run: |
          uv venv -q --python 3.12
          uv pip install -q "meson>=1.9.0" ninja numpy
          # shellcheck disable=SC2086
          uv run --no-project meson setup builddir -Dtests=true -Dpython=false $SETUP
          uv run --no-project meson compile -C builddir
          uv run --no-project meson test -C builddir --print-errorlogs

  build-sdist:
    name: Build source distribution
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: false
      - run: uv build --sdist --python 3.12
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cibw-sdist
          path: dist/*.tar.gz

  build-wheels:
    name: Wheels (${{ matrix.os }} ${{ matrix.arch }})
    needs: lint
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86_64
          # Native ARM64 runner, no QEMU
          - os: ubuntu-24.04-arm
            arch: aarch64
          - os: windows-latest
            arch: AMD64
          - os: macos-15-intel
            arch: x86_64
            macosx_deployment_target: "10.15"
            triplet: x64-osx
          - os: macos-latest
            arch: arm64
            macosx_deployment_target: "11.0"
            triplet: arm64-osx
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # vcpkg_installed is reused across runs on Windows and macOS (Linux
      # builds its dependencies inside the manylinux container instead).
      - name: Cache vcpkg packages
        if: runner.os != 'Linux'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/vcpkg_installed
          key: vcpkg-installed-${{ matrix.os }}-${{ matrix.arch }}-${{ hashFiles('vcpkg.json', 'vcpkg-triplets/*.cmake') }}
          restore-keys: |
            vcpkg-installed-${{ matrix.os }}-${{ matrix.arch }}-
          lookup-only: ${{ github.ref_type == 'tag' }} # zizmor: ignore[cache-poisoning] release builds never restore

      # macOS: build the vcpkg dependencies with the wheel's deployment target.
      - name: Install vcpkg dependencies (macOS)
        if: runner.os == 'macOS'
        env:
          VCPKG_BUILD_TYPE: release
          TRIPLET: ${{ matrix.triplet }}
          DEPLOYMENT_TARGET: ${{ matrix.macosx_deployment_target }}
        run: |
          brew install nasm
          export MACOSX_DEPLOYMENT_TARGET="$DEPLOYMENT_TARGET"
          "$VCPKG_INSTALLATION_ROOT/vcpkg" install --triplet="$TRIPLET"
          {
            echo "MACOSX_DEPLOYMENT_TARGET=$DEPLOYMENT_TARGET"
            echo "CMAKE_PREFIX_PATH=$GITHUB_WORKSPACE/vcpkg_installed/$TRIPLET"
            echo "PKG_CONFIG_PATH=$GITHUB_WORKSPACE/vcpkg_installed/$TRIPLET/lib/pkgconfig:$GITHUB_WORKSPACE/vcpkg_installed/$TRIPLET/share/pkgconfig"
          } >> "$GITHUB_ENV"

      # Everything else is in pyproject.toml [tool.cibuildwheel].
      - name: Build and test wheels
        uses: pypa/cibuildwheel@cfbec0988a9c12de5a84206e42aa17442af10d44 # v4.2.1
        env:
          CIBW_ARCHS: ${{ matrix.arch }}

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.arch }}
          path: ./wheelhouse/*.whl
          compression-level: 0 # wheels are already zip files

  # The one check to require in branch protection: skipped jobs count as
  # passed, so this fails explicitly when anything it needs did not succeed.
  ci-passed:
    name: CI passed
    if: always()
    needs: [lint, version, c-tests, build-sdist, build-wheels]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: $RESULTS"
          for r in $RESULTS; do
            if [[ "$r" != success ]]; then
              exit 1
            fi
          done

  publish-to-pypi:
    name: Publish to PyPI
    needs: [version, ci-passed]
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/aubio-ledfx/
    permissions:
      id-token: write # Trusted Publishing
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: wheels-*
          path: dist/
          merge-multiple: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cibw-sdist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  # release-please created the draft release with the changelog; this attaches
  # what went to PyPI and publishes it.
  github-release:
    name: Publish GitHub release
    needs: [version, publish-to-pypi]
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # uploads assets to and publishes the draft release
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: wheels-*
          path: dist/
          merge-multiple: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cibw-sdist
          path: dist/
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          name: aubio-ledfx ${{ needs.version.outputs.version }}
          files: dist/*
          fail_on_unmatched_files: true

  publish-to-test-pypi:
    name: Publish to Test PyPI
    needs: [ci-passed]
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: testpypi
      url: https://test.pypi.org/p/aubio-ledfx/
    permissions:
      id-token: write # Trusted Publishing
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: wheels-*
          path: dist/
          merge-multiple: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cibw-sdist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/
